<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Teléfono</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <h3 class="card-title mb-3" th:text="${telefono.id == null ? 'Registrar Teléfono' : 'Editar Teléfono'}">Teléfono</h3>

                <form th:action="@{/telefonos/guardar}" th:object="${telefono}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label">Modelo del Teléfono:</label>
                        <input type="text" th:field="*{modelo}" class="form-control" placeholder="Ej: iPhone 15, Galaxy S24" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Precio ($):</label>
                        <input type="number" step="0.01" th:field="*{precio}" class="form-control" placeholder="0.00" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Almacenamiento (GB):</label>
                        <input type="number" th:field="*{almacenamientoGb}" class="form-control" placeholder="128, 256, 512" required>
                    </div>

                    <!-- Selección de Marca (Relación ManyToOne) -->
                    <div class="mb-4">
                        <label class="form-label">Marca:</label>
                        <select name="marcaId" class="form-select" required>
                            <option value="" disabled th:selected="${telefono.marca == null}">Selecciona una marca...</option>
                            <option th:each="m : ${marcas}" 
                                    th:value="${m.id}" 
                                    th:text="${m.nombre} + ' (' + ${m.paisOrigen} + ')'"
                                    th:selected="${telefono.marca != null && telefono.marca.id == m.id}">
                            </option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">Guardar</button>
                        <a th:href="@{/telefonos}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
