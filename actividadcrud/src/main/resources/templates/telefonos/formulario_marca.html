<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Marca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <h3 class="card-title mb-3">Registrar Nueva Marca</h3>

                <form th:action="@{/telefonos/marcas/guardar}" th:object="${marca}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Nombre de la Marca:</label>
                        <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: Motorola, Huawei, Google" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">País de Origen:</label>
                        <input type="text" th:field="*{paisOrigen}" class="form-control" placeholder="Ej: Estados Unidos, China, Japón" required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">Guardar Marca</button>
                        <a th:href="@{/telefonos}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
